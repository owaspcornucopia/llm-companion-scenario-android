<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1280" viewBox="0 0 1850 1280" role="img" aria-labelledby="title description">
  <title id="title">AI Anti Fraud 3.0 investigation sequence</title>
  <desc id="description">A sequence diagram showing a user question moving from the Android UI through the embedded AI model, SQL parser, SQLite database, fraud decision engine, and back to the user.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
    .boundary { fill: #eff6ff; fill-opacity: 0.55; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 10 7; }
    .network { fill: #fff7ed; fill-opacity: 0.72; stroke: #ea580c; stroke-width: 2.5; stroke-dasharray: 10 7; }
    .participant { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .participant.external { fill: #fff; stroke: #334155; }
    .participant.risky { fill: #fee2e2; stroke: #b91c1c; }
    .label { font: 700 14px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .detail { font: 12px Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .lifeline { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .activation { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.5; }
    .activation.risky { fill: #fecaca; stroke: #b91c1c; }
    .message { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    .message.return { stroke-dasharray: 7 5; }
    .message.risky { stroke: #b91c1c; stroke-width: 2.5; marker-end: url(#red-arrow); }
    .message-label { font: 13px Arial, sans-serif; fill: #334155; }
    .message-label.risky { fill: #991b1b; font-weight: 700; }
    .fragment { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
    .fragment-label { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1.5; }
    .fragment-text { font: 700 13px Arial, sans-serif; fill: #3730a3; }
    .note { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .note-text { font: 12px Arial, sans-serif; fill: #78350f; }
    .risk-tag { fill: #b91c1c; stroke: #7f1d1d; stroke-width: 1; }
    .risk-text { font: 700 11px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <rect width="1850" height="1280" fill="#ffffff"/>
  <text x="40" y="44" class="title">AI Anti Fraud 3.0 mobile investigation - sequence</text>
  <text x="40" y="71" class="subtitle">The verdict is calculated from SQLite rows; model prose is display-only. Red messages cross the intentionally unsafe prompt, SQL, or disclosure paths.</text>

  <!-- Trust regions -->
  <rect x="220" y="88" width="1260" height="1080" rx="20" class="boundary"/>
  <text x="245" y="116" class="fragment-text">Trust boundary: Android app / emulator process</text>

  <!-- Participants -->
  <rect x="45" y="135" width="150" height="62" rx="10" class="participant external"/>
  <text x="120" y="160" class="label">Tester / user</text>
  <text x="120" y="181" class="detail">external actor</text>

  <rect x="250" y="135" width="155" height="62" rx="10" class="participant"/>
  <text x="327.5" y="160" class="label">Android UI</text>
  <text x="327.5" y="181" class="detail">MainActivity</text>

  <rect x="485" y="135" width="190" height="62" rx="10" class="participant risky"/>
  <text x="580" y="160" class="label">Embedded AI model</text>
  <text x="580" y="181" class="detail">llama.cpp / GGUF</text>

  <rect x="755" y="135" width="175" height="62" rx="10" class="participant risky"/>
  <text x="842.5" y="160" class="label">SQL parser</text>
  <text x="842.5" y="181" class="detail">tool-call extraction</text>

  <rect x="1015" y="135" width="170" height="62" rx="10" class="participant"/>
  <text x="1100" y="160" class="label">SQLite</text>
  <text x="1100" y="181" class="detail">TransactionStore</text>

  <rect x="1270" y="135" width="175" height="62" rx="10" class="participant"/>
  <text x="1357.5" y="160" class="label">Fraud decision</text>
  <text x="1357.5" y="181" class="detail">rows -&gt; verdict</text>

  <!-- Lifelines -->
  <line x1="120" y1="197" x2="120" y2="1145" class="lifeline"/>
  <line x1="327.5" y1="197" x2="327.5" y2="1145" class="lifeline"/>
  <line x1="580" y1="197" x2="580" y2="1145" class="lifeline"/>
  <line x1="842.5" y1="197" x2="842.5" y2="1145" class="lifeline"/>
  <line x1="1100" y1="197" x2="1100" y2="1145" class="lifeline"/>
  <line x1="1357.5" y1="197" x2="1357.5" y2="1145" class="lifeline"/>

  <!-- Main interaction -->
  <line x1="120" y1="245" x2="327.5" y2="245" class="message"/>
  <text x="140" y="235" class="message-label">1. Ask: "Is TX-1002 fraudulent?"</text>
  <rect x="312" y="232" width="31" height="95" class="activation"/>

  <line x1="327.5" y1="355" x2="580" y2="355" class="message risky"/>
  <text x="350" y="345" class="message-label risky">2. Untrusted question prompt</text>
  <rect x="565" y="342" width="31" height="250" class="activation risky"/>
  <rect x="312" y="342" width="31" height="850" class="activation"/>
  <circle cx="470" cy="355" r="15" class="risk-tag"/><text x="470" y="355" class="risk-text">I</text>

  <!-- On-device inference -->
  <rect x="410" y="400" width="700" height="175" class="fragment"/>
  <rect x="410" y="400" width="94" height="30" class="fragment-label"/>
  <text x="423" y="420" class="fragment-text">LLM</text>
  <text x="520" y="420" class="fragment-text">on-device inference only</text>

  <line x1="580" y1="462" x2="580" y2="462" class="message"/>
  <path d="M580 462 H650 V500 H580" class="message"/>
  <text x="600" y="452" class="message-label">3a. Run llama.cpp with bundled GGUF</text>
  <text x="600" y="520" class="message-label">SQL result generated on device</text>

  <line x1="580" y1="790" x2="842.5" y2="790" class="message risky"/>
  <text x="600" y="780" class="message-label risky">4. Model text / raw SELECT</text>
  <circle cx="715" cy="790" r="15" class="risk-tag"/><text x="715" y="790" class="risk-text">T</text>
  <rect x="827.5" y="777" width="31" height="135" class="activation risky"/>

  <line x1="842.5" y1="930" x2="1100" y2="930" class="message risky"/>
  <text x="865" y="920" class="message-label risky">5. Execute generated SQL without binding</text>
  <circle cx="980" cy="930" r="15" class="risk-tag"/><text x="980" y="930" class="risk-text">I</text>
  <rect x="1085" y="917" width="31" height="105" class="activation"/>

  <line x1="1100" y1="1040" x2="1357.5" y2="1040" class="message return"/>
  <text x="1120" y="1030" class="message-label">6. Transaction rows</text>
  <rect x="1342.5" y="1027" width="31" height="85" class="activation"/>

  <line x1="1357.5" y1="1130" x2="580" y2="1130" class="message risky"/>
  <text x="880" y="1120" class="message-label risky">7. Question, SQL, and untrusted rows for summary</text>
  <circle cx="1125" cy="1130" r="15" class="risk-tag"/><text x="1125" y="1130" class="risk-text">I</text>

  <line x1="580" y1="1175" x2="327.5" y2="1175" class="message return"/>
  <text x="365" y="1165" class="message-label">8. Display-only model answer</text>

  <line x1="327.5" y1="1215" x2="120" y2="1215" class="message return"/>
  <text x="140" y="1205" class="message-label">9. Verdict, SQL, rows, and evidence</text>

  <!-- Notes -->
  <rect x="45" y="1005" width="220" height="115" rx="8" class="note"/>
  <text x="60" y="1030" class="note-text">Threat-modeling note:</text>
  <text x="60" y="1052" class="note-text">the tester owns the prompt;</text>
  <text x="60" y="1072" class="note-text">the model owns neither</text>
  <text x="60" y="1092" class="note-text">the verdict nor the data.</text>

  <rect x="1500" y="925" width="310" height="125" rx="8" class="note"/>
  <text x="1515" y="950" class="note-text">The final verdict is computed by</text>
  <text x="1515" y="970" class="note-text">FraudDecisionEngine from database</text>
  <text x="1515" y="990" class="note-text">rows. Model prose is shown to the</text>
  <text x="1515" y="1010" class="note-text">tester but is not trusted as policy.</text>
</svg>
