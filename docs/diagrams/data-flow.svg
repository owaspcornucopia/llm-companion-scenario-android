<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">AI Anti Fraud 3.0 data-flow diagram</title>
  <desc id="description">A threat-modeling data-flow diagram showing the tester, Android application, embedded model, system services, generated SQL, local SQLite, and trust boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
    .boundary { fill: #eff6ff; fill-opacity: 0.58; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 10 7; }
    .boundary.external { fill: #fff7ed; stroke: #ea580c; }
    .boundary.system { fill: #f8fafc; stroke: #64748b; }
    .boundary-title { font: 700 15px Arial, sans-serif; fill: #1d4ed8; }
    .boundary-title.external { fill: #c2410c; }
    .boundary-title.system { fill: #475569; }
    .external-entity { fill: #fff; stroke: #334155; stroke-width: 2; }
    .process { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .process.risky { fill: #fee2e2; stroke: #b91c1c; }
    .store-body { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .store-top { fill: #bbf7d0; stroke: #15803d; stroke-width: 2; }
    .store-bottom { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .node-label { font: 700 15px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .node-detail { font: 12px Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
    .flow.risky { stroke: #b91c1c; stroke-width: 2.6; marker-end: url(#red-arrow); }
    .flow-label { font: 12px Arial, sans-serif; fill: #334155; }
    .flow-label.risky { fill: #991b1b; font-weight: 700; }
    .threat { fill: #b91c1c; stroke: #7f1d1d; stroke-width: 1.5; }
    .threat-text { font: 700 11px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    .legend-title { font: 700 14px Arial, sans-serif; fill: #0f172a; }
    .legend-text { font: 12px Arial, sans-serif; fill: #334155; }
  </style>

  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="40" y="44" class="title">AI Anti Fraud 3.0 - data flow and trust boundaries</text>
  <text x="40" y="71" class="subtitle">DFD notation: rectangles are external entities, rounded boxes are processes, cylinders are data stores, dashed boxes are trust boundaries, and red tags identify STRIDE pressure points.</text>

  <!-- Trust boundaries -->
  <rect x="320" y="125" width="850" height="765" rx="20" class="boundary"/>
  <text x="345" y="153" class="boundary-title">Trust boundary: Android app and emulator</text>
  <rect x="1230" y="510" width="320" height="350" rx="20" class="boundary system"/>
  <text x="1255" y="538" class="boundary-title system">Trust boundary: Android system services</text>

  <!-- External entities -->
  <rect x="40" y="230" width="225" height="100" rx="5" class="external-entity" filter="url(#shadow)"/>
  <text x="152" y="270" class="node-label">Tester / user</text>
  <text x="152" y="294" class="node-detail">controls the question</text>
  <text x="152" y="312" class="node-detail">and can inject text</text>

  <rect x="40" y="695" width="225" height="100" rx="5" class="external-entity" filter="url(#shadow)"/>
  <text x="152" y="735" class="node-label">Other Android app</text>
  <text x="152" y="759" class="node-detail">can call exported</text>
  <text x="152" y="777" class="node-detail">components</text>

  <rect x="1270" y="600" width="240" height="95" rx="14" class="process risky" filter="url(#shadow)"/>
  <text x="1390" y="638" class="node-label">Clipboard / Logcat</text>
  <text x="1390" y="662" class="node-detail">system-readable result</text>
  <text x="1390" y="680" class="node-detail">and sensitive rows</text>

  <rect x="1270" y="735" width="240" height="95" rx="14" class="process risky" filter="url(#shadow)"/>
  <text x="1390" y="773" class="node-label">Backup / restored state</text>
  <text x="1390" y="797" class="node-detail">preferences and files</text>
  <text x="1390" y="815" class="node-detail">without integrity checks</text>

  <!-- Processes and stores inside the Android boundary -->
  <rect x="390" y="205" width="210" height="105" rx="14" class="process" filter="url(#shadow)"/>
  <text x="495" y="245" class="node-label">Android UI</text>
  <text x="495" y="269" class="node-detail">MainActivity</text>
  <text x="495" y="287" class="node-detail">shows SQL, rows, verdict</text>

  <rect x="690" y="190" width="250" height="125" rx="14" class="process risky" filter="url(#shadow)"/>
  <text x="815" y="232" class="node-label">Embedded model</text>
  <text x="815" y="256" class="node-detail">llama.cpp in app process</text>
  <text x="815" y="278" class="node-detail">generates SQL and summary</text>
  <text x="815" y="300" class="node-detail">prompt boundary is untrusted</text>

  <g>
    <rect x="975" y="200" width="135" height="105" class="store-body"/>
    <ellipse cx="1042.5" cy="200" rx="67.5" ry="17" class="store-top"/>
    <path d="M975 200 V305 M1110 200 V305" fill="none" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="1042.5" cy="305" rx="67.5" ry="17" class="store-bottom"/>
    <text x="1042.5" y="240" class="node-label">GGUF model</text>
    <text x="1042.5" y="264" class="node-detail">app-private files</text>
    <text x="1042.5" y="282" class="node-detail">optional adapter</text>
  </g>

  <rect x="690" y="400" width="250" height="95" rx="14" class="process risky" filter="url(#shadow)"/>
  <text x="815" y="438" class="node-label">SQL tool-call parser</text>
  <text x="815" y="462" class="node-detail">accepts permissive model text</text>
  <text x="815" y="480" class="node-detail">and extracts raw SELECT</text>

  <g>
    <rect x="390" y="450" width="220" height="130" class="store-body"/>
    <ellipse cx="500" cy="450" rx="110" ry="20" class="store-top"/>
    <path d="M390 450 V580 M610 450 V580" fill="none" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="500" cy="580" rx="110" ry="20" class="store-bottom"/>
    <text x="500" y="500" class="node-label">SQLite database</text>
    <text x="500" y="524" class="node-detail">pwnednext.db</text>
    <text x="500" y="546" class="node-detail">synthetic transactions</text>
  </g>

  <rect x="690" y="570" width="250" height="95" rx="14" class="process" filter="url(#shadow)"/>
  <text x="815" y="608" class="node-label">Fraud decision engine</text>
  <text x="815" y="632" class="node-detail">evaluates returned rows</text>
  <text x="815" y="650" class="node-detail">verdict is not model prose</text>

  <g>
    <rect x="390" y="705" width="220" height="105" class="store-body"/>
    <ellipse cx="500" cy="705" rx="110" ry="18" class="store-top"/>
    <path d="M390 705 V810 M610 705 V810" fill="none" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="500" cy="810" rx="110" ry="18" class="store-bottom"/>
    <text x="500" y="748" class="node-label">SharedPreferences</text>
    <text x="500" y="772" class="node-detail">last result / override</text>
    <text x="500" y="790" class="node-detail">client-controlled state</text>
  </g>

  <rect x="690" y="745" width="250" height="95" rx="14" class="process risky" filter="url(#shadow)"/>
  <text x="815" y="783" class="node-label">Exported components</text>
  <text x="815" y="807" class="node-detail">activity, receiver, provider</text>
  <text x="815" y="825" class="node-detail">and path-traversal files</text>

  <!-- Main data flows -->
  <path d="M265 280 H390" class="flow risky"/>
  <text x="272" y="268" class="flow-label risky">question / injection</text>
  <circle cx="330" cy="280" r="15" class="threat"/><text x="330" y="280" class="threat-text">T</text>

  <path d="M600 255 H690" class="flow"/>
  <text x="610" y="242" class="flow-label">prompt</text>

  <path d="M940 250 H975" class="flow"/>
  <text x="940" y="236" class="flow-label">load model</text>

  <path d="M815 315 V400" class="flow risky"/>
  <text x="827" y="360" class="flow-label risky">generated output</text>
  <circle cx="815" cy="370" r="15" class="threat"/><text x="815" y="370" class="threat-text">T</text>

  <path d="M690 448 L610 500" class="flow risky"/>
  <text x="590" y="455" class="flow-label risky">raw SQL, no binding</text>
  <circle cx="650" cy="474" r="15" class="threat"/><text x="650" y="474" class="threat-text">I</text>

  <path d="M610 540 L690 610" class="flow"/>
  <text x="606" y="590" class="flow-label">transaction rows</text>

  <path d="M940 615 H1000 V340 H940" class="flow"/>
  <text x="950" y="600" class="flow-label">rows for summary</text>

  <path d="M690 635 H610 V285 H600" class="flow"/>
  <text x="615" y="674" class="flow-label">verdict / SQL / rows</text>

  <path d="M500 310 V705" class="flow risky"/>
  <text x="512" y="505" class="flow-label risky">last result / override</text>
  <circle cx="500" cy="620" r="15" class="threat"/><text x="500" y="620" class="threat-text">T</text>

  <path d="M600 270 C1080 390 1130 600 1270 645" class="flow risky"/>
  <text x="1010" y="490" class="flow-label risky">copy and Logcat exposure</text>
  <circle cx="1130" cy="545" r="15" class="threat"/><text x="1130" y="545" class="threat-text">I</text>

  <path d="M265 745 H690" class="flow risky"/>
  <text x="285" y="733" class="flow-label risky">exported IPC / file access</text>
  <circle cx="505" cy="745" r="15" class="threat"/><text x="505" y="745" class="threat-text">E</text>

  <path d="M940 790 H1270" class="flow risky"/>
  <text x="1000" y="778" class="flow-label risky">backup / restore</text>
  <circle cx="1135" cy="790" r="15" class="threat"/><text x="1135" y="790" class="threat-text">T</text>

  <!-- Legend -->
  <text x="40" y="925" class="legend-title">Notation</text>
  <rect x="40" y="945" width="55" height="30" rx="3" class="external-entity"/>
  <text x="107" y="966" class="legend-text">external entity</text>
  <rect x="245" y="945" width="65" height="30" rx="9" class="process"/>
  <text x="322" y="966" class="legend-text">process</text>
  <ellipse cx="455" cy="945" rx="35" ry="9" class="store-top"/>
  <rect x="420" y="945" width="70" height="30" class="store-body"/>
  <ellipse cx="455" cy="975" rx="35" ry="9" class="store-bottom"/>
  <text x="505" y="966" class="legend-text">data store</text>
  <line x1="635" y1="960" x2="700" y2="960" class="flow"/>
  <text x="715" y="966" class="legend-text">data flow</text>
  <line x1="835" y1="945" x2="835" y2="980" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="850" y="966" class="legend-text">trust boundary</text>

  <text x="1040" y="925" class="legend-title">STRIDE tags used in this scenario</text>
  <circle cx="1055" cy="957" r="14" class="threat"/><text x="1055" y="957" class="threat-text">T</text>
  <text x="1078" y="962" class="legend-text">Tampering</text>
  <circle cx="1180" cy="957" r="14" class="threat"/><text x="1180" y="957" class="threat-text">I</text>
  <text x="1203" y="962" class="legend-text">Information disclosure</text>
  <circle cx="1390" cy="957" r="14" class="threat"/><text x="1390" y="957" class="threat-text">E</text>
  <text x="1413" y="962" class="legend-text">Elevation of privilege</text>
  <text x="1040" y="990" class="legend-text">Red flows are deliberately vulnerable data crossings, not recommended design.</text>
</svg>
